; CLAWBOT_LEDGER_PROFILE=production
[global]
mode = production

[uuid]
generator_type = internal
server_id = 0

[duplicate_checker]
checker_type = in_memory
cleanup_interval = 60
duplicate_submissions_interval = 300

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 8888
domain = ledger.66ccff-labs.com
root_url = https://ledger.66ccff-labs.com/
static_root_path = public
enable_gzip = true
log_request = false
request_id_header = true

[mcp]
enable_mcp = false
mcp_allowed_remote_ips = 127.0.0.1

[database]
type = sqlite3
db_path = D:\Clawbot\ezbookkeeping\data\ezbookkeeping.db
log_query = false
auto_update_database = true

[log]
mode = file
level = warn
log_path = D:\Clawbot\ezbookkeeping\log\ezbookkeeping.log
request_log_path =
query_log_path =
log_file_rotate = true
log_file_max_size = 10485760
log_file_max_days = 7

[storage]
type = local_filesystem
local_filesystem_path = D:\Clawbot\ezbookkeeping\storage

[security]
secret_key = __PRESERVE_EXISTING_LOCAL_SECRET__
trusted_proxy_ips = 127.0.0.1
token_expired_time = 604800
token_min_refresh_interval = 86400
enable_api_token = true
api_token_allowed_remote_ips = 127.0.0.1
max_failures_per_ip_per_minute = 5
max_failures_per_user_per_minute = 5

[auth]
enable_internal_auth = true
enable_oauth2_auth = false
enable_two_factor = true
enable_forget_password = false
oauth2_user_identifier = email

[user]
enable_register = false

[map]
amap_security_verification_method = internal_proxy

[exchange_rates]
data_source = euro_central_bank
